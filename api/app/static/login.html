<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Window - Sign in</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 8vh auto 0; padding: 0 16px 24px; color: #12181f; }
  h1 { font-size: 1.4rem; }
  /* 16px minimum keeps iOS Safari from auto-zooming in when a field is tapped */
  input { display: block; width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; }
  button { width: 100%; padding: 12px; margin-top: 4px; font-size: 16px; cursor: pointer; min-height: 44px; }
  #error { color: #a24c39; font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>Access Window</h1>
  <form id="login-form">
    <input type="email" id="email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p id="error"></p>
  </form>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (res.ok) {
        const body = await res.json();
        window.location.href = body.role === "parent" ? "/viewer.html" : "/admin/";
        return;
      }
      const body = await res.json().catch(() => ({}));
      document.getElementById("error").textContent = body.detail || "Sign in failed.";
    });
  </script>
</body>
</html>
