<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Window - Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3vh auto; padding: 0 16px 24px; color: #12181f; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }

  #banner { background: #f0dcc5; color: #7a4419; padding: 8px 12px; border-radius: 4px; margin: 0 0 10px; display: none; font-size: 13.5px; }

  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #12181f; border-radius: 6px; overflow: hidden; }
  #player { width: 100%; height: 100%; display: block; object-fit: contain; }
  #end-card {
    display: none; position: absolute; inset: 0; padding: 20px; text-align: center;
    color: #e7ebef; font-size: 14.5px; align-items: center; justify-content: center;
  }

  #selector {
    display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .cam-btn {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 10px 14px; min-height: 44px; border-radius: 999px;
    background: #e6e9ec; border: 1px solid #c9d0d6; color: #12181f;
    font-size: 13.5px; cursor: pointer; white-space: nowrap;
  }
  .cam-btn.active { background: #12181f; color: #fff; border-color: #12181f; }
  .cam-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #93a0ac; flex-shrink: 0; }
  .cam-btn .dot.online { background: #3f8562; }
  .cam-btn .dot.offline { background: #a24c39; }

  #empty { color: #5b6875; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1 id="camera-label">Loading...</h1>
  <div id="banner"></div>

  <div id="stage" class="hidden">
    <video id="player" controls autoplay muted playsinline></video>
    <div id="end-card"></div>
  </div>
  <p id="empty" class="hidden">No cameras assigned yet.</p>

  <div id="selector"></div>

  <script>
    // Well under STREAM_TOKEN_TTL_SECONDS (3600s default) - the token isn't
    // what enforces the cutoff (MediaMTX re-checks the real schedule via
    // /internal/validate on every segment regardless), so it can be long-
    // lived and refreshed rarely instead of reloading the player constantly.
    const TOKEN_REFRESH_MS = 20 * 60 * 1000;
    const STATUS_POLL_MS = 15_000;

    let cameras = [];
    let activeCameraId = null;
    let hls = null;
    let tokenRefreshTimer = null;

    async function init() {
      const res = await fetch("/api/me");
      if (!res.ok) {
        window.location.href = "/login.html";
        return;
      }
      const me = await res.json();
      cameras = me.cameras;

      if (!cameras.length) {
        document.getElementById("camera-label").textContent = "Viewer";
        document.getElementById("empty").classList.remove("hidden");
        return;
      }

      document.getElementById("stage").classList.remove("hidden");
      renderSelector();
      selectCamera(cameras[0].id);

      pollAllStatuses();
      setInterval(pollAllStatuses, STATUS_POLL_MS);
    }

    function renderSelector() {
      const el = document.getElementById("selector");
      if (cameras.length <= 1) {
        el.classList.add("hidden");
        return;
      }
      el.innerHTML = cameras
        .map(
          (c) => `<button class="cam-btn" data-id="${c.id}" onclick="selectCamera('${c.id}')">
            <span class="dot" id="dot-${c.id}"></span>${c.label}
          </button>`
        )
        .join("");
    }

    function selectCamera(id) {
      activeCameraId = id;
      document.getElementById("camera-label").textContent = cameras.find((c) => c.id === id)?.label ?? "";
      document.querySelectorAll(".cam-btn").forEach((b) => b.classList.toggle("active", b.dataset.id === id));
      document.getElementById("banner").style.display = "none";

      clearInterval(tokenRefreshTimer);
      refreshToken();
      tokenRefreshTimer = setInterval(refreshToken, TOKEN_REFRESH_MS);
    }

    async function refreshToken() {
      const forCamera = activeCameraId;
      const res = await fetch("/api/stream-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ camera_id: forCamera }),
      });
      if (forCamera !== activeCameraId) return; // switched cameras while this was in flight
      if (!res.ok) {
        showEndCard("Viewing hours have ended for this camera.");
        return;
      }
      const data = await res.json();
      playStream(data.stream_url);
    }

    function playStream(url) {
      document.getElementById("end-card").style.display = "none";
      const video = document.getElementById("player");
      video.style.display = "block";
      if (window.Hls && Hls.isSupported()) {
        if (hls) {
          // Swap the source on the existing player instead of tearing the
          // whole thing down - a full destroy/recreate every refresh is
          // what was actually causing the buffering, not bandwidth.
          hls.loadSource(url);
          return;
        }
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
      }
    }

    async function pollAllStatuses() {
      const results = await Promise.all(
        cameras.map(async (cam) => {
          const res = await fetch(`/api/session-status?camera_id=${cam.id}`);
          if (!res.ok) return null;
          return { id: cam.id, status: await res.json() };
        })
      );
      results.filter(Boolean).forEach(({ id, status }) => {
        const dot = document.getElementById(`dot-${id}`);
        if (dot) dot.className = "dot " + (!status.camera_online ? "offline" : status.allowed ? "online" : "");
        if (id === activeCameraId) applyActiveStatus(status);
      });
    }

    function applyActiveStatus(status) {
      if (!status.camera_online) {
        showEndCard("This camera is temporarily offline - we've been notified.");
        return;
      }
      if (!status.allowed) {
        showEndCard("Viewing hours have ended for this camera.");
        return;
      }
      const banner = document.getElementById("banner");
      if (status.window_end) {
        const end = new Date(status.window_end);
        const minutesLeft = (end - new Date()) / 60000;
        if (minutesLeft <= 2) {
          banner.style.display = "block";
          banner.textContent = `Viewing ends at ${end.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
          return;
        }
      }
      banner.style.display = "none";
    }

    function showEndCard(message) {
      const player = document.getElementById("player");
      const card = document.getElementById("end-card");
      player.style.display = "none";
      document.getElementById("banner").style.display = "none";
      card.style.display = "flex";
      card.textContent = message;
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    init();
  </script>
</body>
</html>
