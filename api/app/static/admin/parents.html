<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Window - Parents</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="shell">
    <nav class="admin-nav">
      <div class="brand">Access Window</div>
      <div class="role-tag" id="nav-role">...</div>
      <a href="/admin/">Dashboard</a>
      <a href="/admin/parents.html">Parents</a>
      <a href="/admin/grants.html">Schedules</a>
      <a href="/admin/overrides.html">Overrides</a>
      <a href="/admin/cameras.html" data-super-admin-only>Cameras</a>
      <a href="/admin/admins.html" data-super-admin-only>Admins</a>
      <a href="/admin/audit.html">Audit Log</a>
      <div class="spacer"></div>
      <button class="logout" onclick="logout()">Sign out</button>
    </nav>
    <main>
      <h1>Parents</h1>
      <p class="lede">Invite a parent, then give them a schedule under Schedules. No email is sent automatically - copy the invite link and send it yourself.</p>

      <form class="panel" id="invite-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="display_name">Display name</label>
        <input type="text" id="display_name" placeholder="Shown to them, e.g. the family name" required>
        <button type="submit">Send invite</button>
        <p class="msg" id="invite-msg"></p>
        <div class="invite-link hidden" id="invite-link"></div>
      </form>

      <h2>All parents</h2>
      <div class="table-wrap">
        <table id="parents-table">
          <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    async function loadParents() {
      const res = await apiFetch("/api/admin/users");
      const users = await res.json();
      const parents = users.filter((u) => u.role === "parent");

      const tbody = document.querySelector("#parents-table tbody");
      tbody.innerHTML = parents
        .map(
          (u) => `
        <tr data-id="${u.id}">
          <td>${u.display_name}</td>
          <td>${u.email}</td>
          <td>${u.is_active ? '<span class="pill">active</span>' : '<span class="pill inactive">disabled</span>'}${u.has_password ? "" : ' <span class="pill role">invite pending</span>'}</td>
          <td class="actions">
            <button class="tiny secondary" onclick="toggleActive('${u.id}', ${!u.is_active})">${u.is_active ? "Disable" : "Enable"}</button>
          </td>
        </tr>`
        )
        .join("") || `<tr><td colspan="4">No parents yet - invite one above.</td></tr>`;
    }

    async function toggleActive(userId, nextActive) {
      await apiFetch(`/api/admin/users/${userId}`, { method: "PATCH", body: { is_active: nextActive } });
      loadParents();
    }

    document.getElementById("invite-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const msg = document.getElementById("invite-msg");
      const linkBox = document.getElementById("invite-link");
      linkBox.classList.add("hidden");

      const res = await apiFetch("/api/admin/invites", {
        method: "POST",
        body: {
          email: document.getElementById("email").value,
          display_name: document.getElementById("display_name").value,
          role: "parent",
        },
      });
      const body = await res.json();
      if (!res.ok) {
        showMsg(msg, body.detail || "Could not create invite.", true);
        return;
      }
      showMsg(msg, "Invite created - copy the link below and send it to them.", false);
      linkBox.textContent = window.location.origin + body.invite_url_path;
      linkBox.classList.remove("hidden");
      document.getElementById("invite-form").reset();
      loadParents();
    });

    (async () => {
      await requireAdmin();
      loadParents();
    })();
  </script>
</body>
</html>
