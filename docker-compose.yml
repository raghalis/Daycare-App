services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: access-window-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8888:8888"
    # RTSP pull from the cameras is outbound only - nothing to forward for that.
    # Port 9997 (the internal health/auth API) is deliberately not published -
    # `api` reaches it over the default network by container name only.

  api:
    image: ghcr.io/raghalis/access-window-api:latest
    container_name: access-window-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      - mediamtx

# No custom networks declared - compose already puts every service in this
# file on one shared default network, so `api` can reach `mediamtx` (and
# vice versa) by container name with no extra configuration. Point NPMPlus
# at this host's published ports (8000 here, 8888 if you also publish
# mediamtx's HLS port) rather than joining a named external network.
